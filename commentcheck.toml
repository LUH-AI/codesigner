# Limits for codesigner's comments, checked by the standalone `commentcheck`
# tool (../commentcheck). Run:
#   ../commentcheck/.venv/bin/commentcheck check --config commentcheck.toml

[scope]
root = "."
include = ["**/*.py"]
exclude = ["**/migrations/**"]
use_git = true
baseline = ".commentcheck/baseline.json"

[words]
max_ratio = 0.40

[chars]
max_ratio = 0.60

[per_comment]
max_ratio = 0.75
min_share = 0.90

[retention]
min_kept_ratio = 0.60

[slop]
dslop_config = "dslop.toml"

[grammar]
model = "en_core_web_md"

[sentences]
exempt_max_words = 10
exempt_kinds = ["comment", "attr", "trailing"]
require_explicit_subject = true

[pronouns]
exempt_max_words = 10
exempt_kinds = ["comment", "attr", "trailing"]
forbid_first_second_person = true

[code_unchanged]
enabled = true

[rubric]
min_total = 35
scores = ".commentcheck/rubric_scores.json"
