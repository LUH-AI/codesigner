{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Export" %} · Codesigner{% endblock %}

{% block content %}
    <h1>{% translate "Export" %}</h1>
    <form method="post" class="settings-form" style="max-width: 34rem; margin-top: 1rem;">
        {% csrf_token %}
        <fieldset class="field">
            <legend class="subheader">{% translate "Time" %}</legend>
            {% for value, label, help in modes %}
                <label class="check">
                    <input type="radio" name="export_timestamps" value="{{ value }}"
                           {% if chosen == value %}checked{% endif %}
                           onchange="this.form.submit()">
                    {{ label }}
                </label>
                <p class="caption">{{ help }}</p>
            {% endfor %}
        </fieldset>
        <noscript><button type="submit" class="btn-primary">{% translate "Save" %}</button></noscript>
    </form>
{% endblock %}
