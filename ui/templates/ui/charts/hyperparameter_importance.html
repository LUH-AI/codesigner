{% load i18n %}
<section class="card" data-chart="{{ chart.key }}">
    <div class="subheader">{{ chart.label }}</div>
    <p id="imp-warning" class="alert warning" hidden></p>
    <div id="{{ chart.dom_id }}" class="chart"></div>
    <p id="imp-none" class="caption" hidden>{% translate "No importance data available." %}</p>
</section>
