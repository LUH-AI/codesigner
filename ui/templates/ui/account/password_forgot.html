{% extends "ui/account/_standalone.html" %}
{% load i18n %}

{% block title %}{% translate "Forgot password" %}{% endblock %}

{% block content %}
        <form method="post" class="card">
            {% csrf_token %}
            <div class="field">
                <label for="identifier">{{ onboarding.label }}</label>
                <input type="{{ onboarding.input_type }}" id="identifier" name="identifier" required autofocus>
            </div>
            <button type="submit" class="btn-block">{% translate "Send" %}</button>
        </form>
        <p class="caption"><a href="{% url 'ui:login' %}">{% translate "Sign in" %}</a></p>
{% endblock %}
