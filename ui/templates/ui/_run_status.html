{% load static i18n %}
<div id="run-status" class="card" hx-get="{% url 'ui:run_status' experiment.pk %}"
     hx-trigger="every 2s" hx-swap="outerHTML" style="max-width: 28rem;">
    <div class="alert info" style="display: flex; align-items: center; gap: 0.5rem;">
        <span class="spinner"></span> {% blocktranslate with status=run.get_status_display %}Optimizing… ({{ status }}){% endblocktranslate %}
    </div>
    <form method="post" action="{% url 'ui:run_cancel' experiment.pk %}" style="margin-top: 0.75rem;">
        {% csrf_token %}
        <button type="submit" class="btn">{% translate "Cancel run" %}</button>
    </form>
</div>
