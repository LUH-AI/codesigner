name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For the slow job below, which is too long to run on every push.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # swig builds SMAC's pyrfr backend; gettext compiles the translations.
      - run: sudo apt-get update && sudo apt-get install -y swig gettext
      - run: pip install -r requirements.txt
      # Register the project's own metadata so importlib.metadata resolves the
      # app version (single source: pyproject.toml). Deps are installed above.
      - run: pip install -e . --no-deps
      # The model contract is its own dependency-free distribution, because it
      # is also installed into each model's environment. core.models imports it.
      - run: pip install -e ./model_sdk --no-deps
      # No translation step. German and Spanish are shelved and their catalogs
      # hold unreviewed drafts; compiling them is precisely what must not
      # happen, and re-extracting would only churn a file nobody reads.
      # See config/settings.py LANGUAGES.
      # Fast suite includes the check that the shelved catalogs stay shelved.
      # The slow SMAC end-to-end tests are a separate opt-in job.
      # uv is not installed here, so the environment tests run against a shim
      # and the real-uv ones are skipped by their marker.
      - run: python -m pytest -m "not slow and not uv"

  slow:
    # The SMAC end-to-end tests: real searches, ten minutes of them. Too slow
    # for every push and too load-bearing to leave unrun — they are the only
    # thing that checks a search actually reaches its model, that a resumed run
    # picks up where it left off, and that an experiment recreated from its
    # .ihpo produces the same trials. Weekly, and on demand.
    #
    # This job is why the comment above says the slow tests are opt-in. It did
    # not exist when that comment was written, and five of them sat broken for a
    # commit because nothing ran them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y swig gettext
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pip install -e ./model_sdk --no-deps
      - run: python -m pytest -m slow

  model-environments:
    # The tests that check uv accepts the commands we build. Separate because it
    # needs uv, and because a uv release changing a flag should fail visibly here
    # rather than looking like an unrelated breakage.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y swig
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pip install -e ./model_sdk --no-deps
      - run: python -m pytest -m uv

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codesigner:ci .
