name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # swig builds SMAC's pyrfr backend; gettext compiles the translations.
      - run: sudo apt-get update && sudo apt-get install -y swig gettext
      - run: pip install -r requirements.txt
      # Register the project's own metadata so importlib.metadata resolves the
      # app version (single source: pyproject.toml). Deps are installed above.
      - run: pip install -e . --no-deps
      # The model contract is its own dependency-free distribution, because it
      # is also installed into each model's environment. core.models imports it.
      - run: pip install -e ./model_sdk --no-deps
      # Re-extract strings from source FIRST, so the i18n completeness/fuzzy
      # test (tests/ui/i18n) catches catalogs that drifted from the source —
      # a new string, or one whose English changed — not just missing msgstrs.
      - run: python manage.py makemessages -l de -l es --no-obsolete
      - run: python manage.py compilemessages -l de -l es
      # Fast suite includes the i18n completeness/parity checks. The slow SMAC
      # end-to-end tests are a separate opt-in job.
      # uv is not installed here, so the environment tests run against a shim
      # and the real-uv ones are skipped by their marker.
      - run: python -m pytest -m "not slow and not uv"

  model-environments:
    # The tests that check uv accepts the commands we build. Separate because it
    # needs uv, and because a uv release changing a flag should fail visibly here
    # rather than looking like an unrelated breakage.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y swig
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pip install -e ./model_sdk --no-deps
      - run: python -m pytest -m uv

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codesigner:ci .
