name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install "smac @ git+https://github.com/automl/SMAC3.git@dev_1320"
          pip install -r requirements.txt
      - name: Run tests
        run: pytest
