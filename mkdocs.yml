site_name: Codesigner
repo_url: https://github.com/LUH-AI/codesigner
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - content.code.copy

# The pages are generated from the code; this script is how, not a page.
exclude_docs: gen_pages.py

nav:
  - Home: index.md
  - Reference: reference/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [., model_sdk]
          options:
            docstring_style: null
            show_root_heading: true
            show_source: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - toc:
      permalink: true
