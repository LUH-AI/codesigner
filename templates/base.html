{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Codesigner{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>
<body>
    <nav class="sidebar">
        <div class="locale">
            🌐 <span>English</span>
        </div>
        <h1>Experiments</h1>
        <div class="actions">
            <a class="btn btn-block" href="{% url 'web:new_experiment' %}">＋ New</a>
            <a class="btn btn-block" href="{% url 'web:import_experiment' %}">📂 Load</a>
        </div>
        <hr>
        <div class="experiment-list">
            {% for e in sidebar_experiments %}
                <a class="btn btn-block{% if request.resolver_match.kwargs.pk == e.pk %} btn-primary{% endif %}"
                   href="{% url 'web:experiment_detail' e.pk %}">{{ e.name }}</a>
            {% empty %}
                <span class="placeholder">No experiments yet.</span>
            {% endfor %}
        </div>
        <div class="nav-links">
            <a href="{% url 'web:inspect' %}">Inspect an .ihpo file</a>
        </div>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
