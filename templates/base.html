{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Codesigner{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>
<body>
    <nav class="sidebar">
        <div class="locale">
            🌐 <span>English</span>
        </div>
        <h1>Experiments</h1>
        <div class="actions">
            <a class="btn btn-block" href="{% url 'web:new_experiment' %}">＋ New</a>
            <button class="btn-block" disabled title="Coming in the load step">📂 Load</button>
        </div>
        <hr>
        <div class="experiment-list">
            {% block experiment_list %}{% endblock %}
        </div>
        <div class="nav-links">
            <a href="{% url 'web:inspect' %}">Inspect an .ihpo file</a>
        </div>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
