# The assistant's library: the papers SMAC and Codesigner rest on, and the
# background a person tuning hyperparameters may ask about.
#
# Built into a searchable index by `manage.py assistant_knowledge build`
# (assistant/library.py), which fetches each open-access source — `arxiv`, or a
# `pdf` or `html` address — and splits it into passages. An entry with no open
# source is indexed by its `summary` alone, which is ours, not the paper's,
# and is shown as such. The papers' text is not kept in the repository.
#
# Fields: key (how the assistant cites it), title, authors, year, venue;
# arxiv | pdf | html | summary; topics; used_by (what in SMAC or Codesigner
# rests on it).

