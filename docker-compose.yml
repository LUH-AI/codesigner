# Two processes off one image: the gunicorn web server and the huey consumer.
# They share a `data` volume holding the SQLite DB, the huey queue, and uploaded
# media, so both see the same run state. `datasets/` and `mounted_models/` are
# bind-mounted from the host — drop CSVs / model .py files there and they appear
# as demo-dataset and mounted-model options in the UI.
#
# `uv-cache` is separate from `data` on purpose: it holds downloads and built
# model environments, so it is large, disposable and safe to `docker volume rm`,
# while `data` holds the things that cannot be rebuilt. Only the worker needs it —
# all model execution happens there.
services:
  web:
    build: .
    command: web
    env_file: .env
    environment:
      DEBUG: "False"
      HUEY_IMMEDIATE: "false"
      DATABASE_URL: "sqlite:////app/data/db.sqlite3"
      HUEY_FILENAME: "/app/data/huey.sqlite3"
      MEDIA_ROOT: "/app/data/media"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
      - ./datasets:/app/datasets
      - ./mounted_models:/app/mounted_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').read()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: worker
    env_file: .env
    environment:
      DEBUG: "False"
      HUEY_IMMEDIATE: "false"
      DATABASE_URL: "sqlite:////app/data/db.sqlite3"
      HUEY_FILENAME: "/app/data/huey.sqlite3"
      MEDIA_ROOT: "/app/data/media"
    volumes:
      - data:/app/data
      - uv-cache:/uv-cache
      - ./datasets:/app/datasets
      - ./mounted_models:/app/mounted_models
    # A model gets a process of its own but not a machine of its own, so a
    # runaway one is bounded here. Without a limit the kernel may pick the
    # consumer — or the web server — instead.
    mem_limit: 8g
    depends_on:
      web:
        condition: service_healthy

volumes:
  data:
  uv-cache:
